# SonarQube analysis for the IACE monorepo.
#
# NOTE: sonar.projectKey must match the key set in the SonarQube UI exactly.
# Change it there or here, but they have to agree or the scan is rejected.
sonar.projectKey=iace-platform
sonar.projectName=IACE Platform

sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# What to analyse.
#
# Everything lives under apps/ and packages/ (see pnpm-workspace.yaml); there is
# no top-level src/. `prisma` is here for seed.ts, which is real code — its
# migrations are excluded below.
#
# Listed rather than `.` on purpose: `.` makes every future top-level directory
# (docs, scratch output, a tool's cache) analysed by default, and the exclusion
# list becomes the thing that has to keep up.
# ---------------------------------------------------------------------------
sonar.sources=apps,packages,prisma

# ---------------------------------------------------------------------------
# Tests, listed ONE BY ONE.
#
# Spelled out one by one rather than as a `**/test/**` glob. The student SPA was
# called `apps/test` until 2026-09-30, and such a glob would have quietly
# reclassified a whole production app as test code and dropped it out of
# analysis. It is `apps/exams` now, but an explicit list is still what says
# which directories hold tests, so a future `apps/<something>/test` cannot
# surprise anybody.
# ---------------------------------------------------------------------------
sonar.tests=apps/api/test,apps/api/test-db,apps/admin/test,apps/exams/test,packages/contracts/test,packages/ui/test,packages/app-kit/test,apps/mobile/test
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,apps/api/test-db/**

# ---------------------------------------------------------------------------
# Keep noise out. All build output, nothing hand-written.
# ---------------------------------------------------------------------------
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.turbo/**,\
  **/coverage/**,\
  **/*.min.js,\
  prisma/migrations/**

# ---------------------------------------------------------------------------
# Coverage.
#
# `pnpm test:coverage` writes this — see scripts/coverage.mjs. The paths inside
# it are rewritten to be repo-root relative there, because Node emits them
# relative to whichever package ran the tests and Sonar silently discards a
# report whose paths it cannot resolve. That is what 0% looked like.
# ---------------------------------------------------------------------------
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Excluded from the coverage RATIO, still analysed for bugs and smells.
# Each of these is wiring with no branch to get wrong: a test would assert that
# the framework works, and would pass whether or not the app did.
sonar.coverage.exclusions=\
  **/*.module.ts,\
  apps/api/src/main.ts,\
  apps/*/src/main.tsx,\
  apps/*/src/App.tsx,\
  **/*.config.js,\
  **/*.config.ts,\
  packages/config/**,\
  prisma/seed.ts,\
  scripts/**

# ---------------------------------------------------------------------------
# Rules that do not apply to the one screen replicating somebody else's.
#
# The SSC/Railway skin reproduces a government CBT exactly — it is the single
# thing students expect to match, and docs/02 §10 and the ui-conventions skill
# both exempt it from this repo's design system. Its colours were read off the
# live page, so a contrast rule here is asking us to change the paper rather
# than the port. Scoped to that template's own two stylesheets, and to the one
# rule: every other smell in those files still reports.
# ---------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=railwaySkinContrast,nativePresetTokenScan

sonar.issue.ignore.multicriteria.railwaySkinContrast.ruleKey=css:S7924
sonar.issue.ignore.multicriteria.railwaySkinContrast.resourceKey=apps/exams/src/features/exam/templates/railway/*.css

# ---------------------------------------------------------------------------
# One backtracking warning on a build-time parser whose input is a repo file.
#
# tailwind.preset.native.js reads packages/ui/src/tokens.css at BUILD time and
# lifts the dark-theme custom properties out of it, because native has no
# document root to hang data-theme on. The input is a file in this repository,
# so there is no adversary to hand it a pathological string.
#
# Three attempts to satisfy S8786 each changed what the pattern parses, and the
# count is the test: 225 declarations is correct. Anchoring with `^\s*` under
# /m kept 225 but `\s` matches newlines, so the scan could still begin almost
# anywhere and the rule still fired. `[^;\n]+` dropped to 220 — five values
# span lines. Splitting on `;` and anchoring each piece dropped to 174, because
# tokens.css puts comments between declarations.
#
# So the pattern stays as it correctly is, and the rule is off for this one
# file. Scoped to the file and to the rule: every other smell in it still
# reports. If this parser ever reads something a user supplies, delete this
# block first.
# ---------------------------------------------------------------------------
sonar.issue.ignore.multicriteria.nativePresetTokenScan.ruleKey=javascript:S8786
sonar.issue.ignore.multicriteria.nativePresetTokenScan.resourceKey=apps/mobile/tailwind.preset.native.js

# Makes the scanner exit non-zero when the quality gate fails — this is what
# lets scripts/sonar-precommit.sh block the commit. Local only; there is no CI
# scan and none is wanted (the server is on localhost).
sonar.qualitygate.wait=true
