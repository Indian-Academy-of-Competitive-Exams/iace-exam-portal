<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IACE — Tests</title>
    <meta name="description" content="IACE test portal — mock tests for government exams." />
    <script>
      // Applied before first paint so a dark-mode reload never flashes white.
      (function () {
        var stored = localStorage.getItem('iace.theme');
        var theme = stored === 'dark' || stored === 'light' ? stored : null;
        if (theme === null) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        // `dataset.theme` is the same `data-theme` attribute @iace/ui keys off.
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
