# Builds the two API images and pushes them to ECR. It does NOT deploy — _deploy-api.yml decides
# when an image reaches a box, which is what makes a rollback a tag rather than a rebuild.
#
# `staging` CALLS this from staging.yml, so its deploy waits for the image it is about to pull.
# `main` triggers it on push, and production takes the result later, on purpose.
name: Build API image

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'prisma/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/build-api.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Per branch, because the moving tag is. One group for both would let a queued `main` build cancel
# the build a staging release is waiting on.
concurrency:
  group: build-api-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: 598927569098.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build:
    name: Build and push
    # Native arm64, because every box is Graviton. QEMU emulation would also work and takes
    # several times as long. This runner is free only while the repository is PUBLIC — on a
    # private repo on the Free plan it disappears, and docs/04 §15 carries the replacement.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v5

      # `prod` is main's candidate, pushed here; `staging` moves in _deploy-api.yml, only once a release passes.
      # The sha tag is the immutable one a rollback names.
      - name: Pick the moving tag
        id: tag
        run: echo "moving=${{ github.ref_name == 'main' && 'prod' || '' }}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - uses: aws-actions/amazon-ecr-login@v2

      # The runner is thrown away after the job, so removing the builder first only costs ~26s.
      - uses: docker/setup-buildx-action@v4
        with:
          cleanup: false

      # Two targets, one Dockerfile. The migration image carries the Prisma CLI — 156 MB a
      # container serving requests never opens — which is why it is not the runtime image.
      - name: Build runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/examprep/api:${{ github.sha }}
            ${{ steps.tag.outputs.moving && format('{0}/examprep/api:{1}', env.REGISTRY, steps.tag.outputs.moving) || '' }}
          cache-from: type=gha,scope=api-runtime
          cache-to: type=gha,scope=api-runtime,mode=max

      - name: Build migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/examprep/api-migrate:${{ github.sha }}
            ${{ steps.tag.outputs.moving && format('{0}/examprep/api-migrate:{1}', env.REGISTRY, steps.tag.outputs.moving) || '' }}
          cache-from: type=gha,scope=api-migrate
          cache-to: type=gha,scope=api-migrate,mode=max

      - name: Summary
        run: |
          {
            echo "### Images pushed, not deployed"
            echo "| | tag |"
            echo "| --- | --- |"
            echo "| \`examprep/api\` | \`${{ github.sha }}\` ${{ steps.tag.outputs.moving && format(' and `{0}`', steps.tag.outputs.moving) || '' }} |"
            echo "| \`examprep/api-migrate\` | \`${{ github.sha }}\` ${{ steps.tag.outputs.moving && format(' and `{0}`', steps.tag.outputs.moving) || '' }} |"
            echo ""
            echo "On \`staging\` the same run deploys this sha next. To put this build back"
            echo "later, run **Staging** or **Production** with \`${{ github.sha }}\` as the image tag."
          } >> "$GITHUB_STEP_SUMMARY"
