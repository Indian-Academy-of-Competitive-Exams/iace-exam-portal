name: CI

on:
  push:
    # Both, because work lands on `staging` and `main` only moves by promotion — CI that ran on
    # `main` alone would never see a change until it was already production-bound.
    branches: [staging, main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

# A new push supersedes the one before it on the same branch. main is excluded
# so a merge is never cancelled halfway by the next merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Prisma reads this to validate the datasource block. `prisma generate` never
  # connects, so an unreachable URL is correct here — the database job below is
  # where a real one is used.
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/unused
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  # Everything that needs no infrastructure. The test suite deliberately has no
  # Postgres, Redis or S3 dependency (see apps/api/test/support/fakes.ts), which
  # is what keeps this job a couple of minutes rather than a couple of services.
  verify:
    name: Verify
    # The weekly cron exists for the docs job alone; schedule is a workflow-level
    # trigger, so without this guard every job inherits it and runs on a Monday
    # against a tree nobody pushed.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # Reads the pinned version from package.json#packageManager, so CI and a
      # developer's machine cannot drift onto different pnpm releases.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile: fail rather than silently resolve something new. A
      # lockfile that does not match package.json is a broken commit, not a
      # thing for CI to fix on the fly.
      - name: Install
        run: pnpm install --frozen-lockfile

      # The API imports generated Prisma types, so this must precede typecheck.
      - name: Generate Prisma client
        run: pnpm db:generate

      # Ordered cheapest-first, so an obvious failure reports in seconds. Each
      # step runs even if an earlier one failed, so one push reports every
      # problem instead of one problem per push.
      - name: Format
        if: '!cancelled()'
        run: pnpm format:check

      # A workflow mistake otherwise surfaces only when that workflow next runs, often mid-release.
      - name: Workflows
        if: '!cancelled()'
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      # Cheap, and it catches the class of breakage that is hardest to see in a
      # diff: two workspaces asking for different versions of the same library.
      - name: Dependency alignment
        if: '!cancelled()'
        run: pnpm deps:check

      # A key the API reads and a template does not name is found at boot on a box, not in review.
      - name: Environment templates
        if: '!cancelled()'
        run: pnpm env:check

      - name: Lint
        if: '!cancelled()'
        run: pnpm lint

      - name: Typecheck
        if: '!cancelled()'
        run: pnpm typecheck

      - name: Test
        if: '!cancelled()'
        run: pnpm test

      - name: Staging power switch
        if: '!cancelled()'
        run: node --test deploy/staging-power/logic.test.mjs

      - name: Build
        if: '!cancelled()'
        run: pnpm build

  # Everything that needs a database: migrations against the schema, then SQL against Postgres.
  database:
    name: Database
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: iace_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/iace_ci
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/iace_ci_shadow

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create shadow database
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d iace_ci \
            -c 'CREATE DATABASE iace_ci_shadow;'

      # Applies every migration to an empty database, exactly as a deploy does.
      # Catches a migration that is malformed or depends on state only a
      # developer's machine has.
      - name: Apply migrations from scratch
        run: pnpm db:migrate:deploy

      # Catches the other half: a schema.prisma edited without a migration. The
      # two checks together are what make "migrations are the source of the
      # database" true rather than aspirational.
      - name: Check migrations still match the schema
        run: pnpm db:check

      - name: Create test database
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d iace_ci \
            -c 'CREATE DATABASE iace_ci_test;'

      # pnpm test gets these from turbo; the database tier runs outside it, so it needs them first.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build contracts
        run: pnpm --filter @iace/contracts build

      - name: Test the SQL against Postgres
        run: pnpm test:db
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/iace_ci_test

  # One student sits a real paper in a real browser against the real API, Postgres, Redis and queue.
  # Its own job so the browser and the two servers never slow Verify. No MinIO: the sitting never
  # touches S3, and /health answers degraded rather than down without it.
  e2e:
    name: End to end
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: iace_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/iace_e2e?schema=public
      E2E_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Keyed on the lockfile, which pins the Playwright version and so the browser build it needs.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # --with-deps installs the OS libraries every run; the browser download is skipped when cached.
      - name: Install Chromium
        run: pnpm --filter @iace/e2e exec playwright install --with-deps chromium

      # Migrates and seeds iace_e2e, builds both apps and starts them through Playwright's webServer.
      - name: Sit a paper end to end
        run: pnpm e2e

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

  # Doc drift, and the one check here that gates nothing (docs/03 §12). It judges
  # the whole doc set against the whole schema, so as a commit gate it would fail
  # your push for prose somebody else left behind. Weekly and on demand only —
  # the `if` is what keeps it off every push and pull request, since schedule and
  # workflow_dispatch are workflow-level triggers that every job would otherwise
  # inherit. It reads schema.prisma as text, so it needs no Prisma client.
  docs-check:
    name: Docs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check docs against the schema and the source
        run: pnpm docs:check
