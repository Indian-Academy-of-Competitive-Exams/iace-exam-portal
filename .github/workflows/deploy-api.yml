# Puts an already-built image on Box A. Nightly by default, immediately on demand.
#
# Why the API waits and the front end does not: a backend release runs migrations and recreates
# containers with a gap (there is no load balancer to drain through, docs/04 §4), so it is an
# outage of a few seconds at a time nobody chose. A SPA deploy is a file copy. The night slot
# is 02:00 IST — after the backup window and before anyone sits anything.
name: Deploy API

on:
  schedule:
    # 20:30 UTC = 02:00 IST. GitHub may start a cron late under load; nothing here is
    # time-critical to the minute.
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy. "staging" is whatever the last build pushed.'
        required: true
        default: staging
      reason:
        description: 'Why this is going out now rather than tonight'
        required: true

permissions:
  id-token: write
  contents: read

# A nightly run and a hotfix must never recreate containers at the same moment.
concurrency:
  group: deploy-api-staging
  cancel-in-progress: false

env:
  REGISTRY: 598927569098.dkr.ecr.ap-south-1.amazonaws.com
  INSTANCE_NAME: examprep-api-staging

jobs:
  deploy:
    name: Pull and recreate on Box A
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Find Box A
        id: box
        run: |
          id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[0].InstanceId' --output text)
          if [ -z "$id" ] || [ "$id" = "None" ]; then
            echo "::error::No running instance tagged $INSTANCE_NAME"; exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # No ssh, no key, no inbound rule: the agent on the box dials out and runs this as root.
      - name: Deploy
        id: send
        run: |
          TAG="${{ inputs.image_tag || 'staging' }}"
          CMD=$(aws ssm send-command \
            --instance-ids "${{ steps.box.outputs.id }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy $TAG" \
            --parameters commands="[
              \"set -euo pipefail\",
              \"cd /opt/examprep\",
              \"aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin $REGISTRY\",
              \"export API_IMAGE=$REGISTRY/examprep/api MIGRATE_IMAGE=$REGISTRY/examprep/api-migrate API_TAG=$TAG\",
              \"docker compose -f deploy/compose.yml --env-file deploy/.env pull\",
              \"docker compose -f deploy/compose.yml --env-file deploy/.env up -d\",
              \"docker compose -f deploy/compose.yml --env-file deploy/.env ps\"
            ]" \
            --query 'Command.CommandId' --output text)
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # send-command returns as soon as it is queued, so success there says nothing about the
      # deploy. This is the step that actually knows whether it worked.
      - name: Wait and report
        run: |
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "${{ steps.send.outputs.cmd }}" \
              --instance-id "${{ steps.box.outputs.id }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done
          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.cmd }}" \
            --instance-id "${{ steps.box.outputs.id }}" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text | tee /tmp/out
          {
            echo "### Deploy: $status"
            echo "- tag \`${{ steps.send.outputs.tag }}\` on \`${{ steps.box.outputs.id }}\`"
            echo "- reason: ${{ inputs.reason || 'scheduled nightly release' }}"
            echo '```'
            cat /tmp/out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$status" = "Success" ] || { echo "::error::SSM reported $status"; exit 1; }
