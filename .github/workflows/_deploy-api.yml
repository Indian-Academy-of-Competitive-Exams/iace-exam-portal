# The API half of a release, shared by both environments so they cannot drift. Brings the box's
# checkout to this commit, pulls an image that already exists in ECR and recreates the containers;
# it never builds.
name: _deploy-api

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      reason:
        required: true
        type: string
      skip_when_stopped:
        description: 'Staging only: a box that is off is reported, not failed — it pulls on its next start.'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: 598927569098.dkr.ecr.ap-south-1.amazonaws.com
  COMPOSE: docker compose -f deploy/compose.yml --env-file deploy/.env

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Production's environment carries a required reviewer, so this job queues until somebody
    # clicks. That gate is what makes "we release production deliberately" a mechanism.
    environment: ${{ inputs.environment }}

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # A box that is off is not a fault on staging: boot-update.sh pulls this image when it starts.
      - name: Find the box
        id: box
        run: |
          find() {
            aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=${{ vars.API_INSTANCE_NAME }}" "Name=instance-state-name,Values=$1" \
              --query 'Reservations[].Instances[0].InstanceId' --output text
          }
          id=$(find running)
          if [ -n "$id" ] && [ "$id" != "None" ]; then
            echo "id=$id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          off=$(find pending,stopping,stopped)
          if [ "${{ inputs.skip_when_stopped }}" = "true" ] && [ -n "$off" ] && [ "$off" != "None" ]; then
            msg="ECR updated to ${{ inputs.image_tag }}. The ${{ inputs.environment }} box is off — it pulls this image when it is next switched on."
            echo "::notice::$msg"
            {
              echo "### ${{ inputs.environment }} API: not deployed, the box is off"
              echo "$msg"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "off=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::No running instance tagged ${{ vars.API_INSTANCE_NAME }}"
          exit 1

      # No ssh, no key, no inbound rule: the agent dials out and runs this as root.
      #
      # compose.yml, the Caddyfile and Alloy's config are read from the box's checkout, so the
      # checkout moves first — without it a release changed the image and nothing else. git runs
      # as whoever owns the checkout, because as root it refuses a directory it does not own.
      # --ff-only so a box somebody edited by hand stops the release instead of losing the edit.
      #
      # await-healthy fails the release unless exam, core and worker report healthy; rollback-to names the image to go back to.
      #
      # The restart is for the two mounted configs alone: `up -d` recreates a container whose
      # compose entry changed, never one whose mounted file did, and a running container holds
      # the file it started with. A \$ is the box's variable; a bare $ is expanded here.
      - name: Sync, pull and recreate
        id: send
        if: steps.box.outputs.off != 'true'
        run: |
          CMD=$(aws ssm send-command --instance-ids "${{ steps.box.outputs.id }}" \
            --document-name AWS-RunShellScript --comment "deploy ${{ inputs.image_tag }}" \
            --parameters commands="[
              \"set -euo pipefail\",
              \"cd /opt/examprep\",
              \"OWNER=\$(stat -c %U .git)\",
              \"OLD=\$(sudo -u \$OWNER git rev-parse HEAD)\",
              \"sudo -u \$OWNER git fetch --quiet origin ${{ github.sha }}\",
              \"sudo -u \$OWNER git merge --quiet --ff-only ${{ github.sha }}\",
              \"aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin $REGISTRY\",
              \"export API_IMAGE=$REGISTRY/examprep/api MIGRATE_IMAGE=$REGISTRY/examprep/api-migrate API_TAG=${{ inputs.image_tag }}\",
              \"PREV=\$(docker inspect -f '{{.Config.Image}}' \$($COMPOSE ps -q core) 2>/dev/null || echo none)\",
              \"echo rollback-to: \$PREV\",
              \"$COMPOSE pull\",
              \"$COMPOSE up -d\",
              \"COMPOSE='$COMPOSE' ./deploy/await-healthy.sh\",
              \"sudo -u \$OWNER git diff --quiet \$OLD HEAD -- deploy/Caddyfile deploy/alloy || $COMPOSE restart caddy alloy\",
              \"$COMPOSE ps\",
              \"./deploy/prune-disk.sh\"
            ]" --query 'Command.CommandId' --output text)
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"

      # send-command succeeds the moment it is queued, which says nothing about the deploy.
      - name: Wait and report
        if: steps.box.outputs.off != 'true'
        run: |
          ID=${{ steps.box.outputs.id }}
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "${{ steps.send.outputs.cmd }}" \
              --instance-id "$ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "${{ steps.send.outputs.cmd }}" \
            --instance-id "$ID" --query '[Status,StandardOutputContent,StandardErrorContent]' --output text | tee /tmp/out
          {
            echo "### ${{ inputs.environment }} API: $status"
            echo "- tag \`${{ inputs.image_tag }}\` on \`$ID\`"
            echo "- reason: ${{ inputs.reason }}"
            echo '```'; cat /tmp/out; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$status" = "Success" ] || { echo "::error::SSM reported $status"; exit 1; }
