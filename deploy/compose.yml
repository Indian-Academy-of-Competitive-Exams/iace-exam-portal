# Box A — the API box, one per environment. Caddy and the three roles, and nothing else:
# Postgres is RDS and Valkey is Box B (docs/04-infrastructure.md §2).
#
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
#
# Only Caddy publishes a port. The three API containers are reachable on the compose network
# alone, so the box's firewall has two holes in it rather than five.

name: iace-api

# CPU is a WEIGHT here, never a quota: `cpu_shares` only decides who yields under contention, so a
# container is free to use a whole idle box. `cpus` was a hard cgroup ceiling, and below one core CFS
# spends the quota early in each 100 ms window and freezes the process for the rest of it — a low CPU
# average beside a terrible p99, which is the opposite of what the exam role is sized for. Memory
# stays a hard limit: overrunning it is an OOM, not a slow request.
#
# 2048:1536:1024 is the old 0.8:0.6:0.4 ratio. caddy's unset default of 1024 and alloy's 256 are in
# the denominator with them, so under total contention on 2 vCPU the floor is exam 0.70, core 0.52,
# worker 0.35; with core and the shipper idle, which is what a live sitting looks like, exam takes
# the box.
#
# Docker's default json-file driver never rotates, and Box A has 30 GB. Capped here so a stuck
# container logging in a loop cannot take the disk — and with it the migrate step of the next release.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # Runs to completion before the API starts, exactly as the one-off task does on a real release.
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: 'no'
    logging: *logging

  exam:
    build: &api-image
      context: ..
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      API_ROLE: exam
      API_PORT: 3000
      UV_THREADPOOL_SIZE: 16
      NODE_OPTIONS: --max-old-space-size=${EXAM_HEAP_MB:-384}
    cpu_shares: ${EXAM_CPU_SHARES:-2048}
    mem_limit: ${EXAM_MEM:-1g}
    # Long enough for BullMQ to close and Prisma to drain; the default 10s is not.
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    # `/health` answers 200 even while degraded; only `/health/ready` fails when a dependency is down.
    healthcheck: &api-health
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/health/ready']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  core:
    build: *api-image
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      API_ROLE: core
      API_PORT: 3000
      UV_THREADPOOL_SIZE: 8
      NODE_OPTIONS: --max-old-space-size=${CORE_HEAP_MB:-384}
    cpu_shares: ${CORE_CPU_SHARES:-1536}
    mem_limit: ${CORE_MEM:-1g}
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck: *api-health

  # EXACTLY ONE, always. concurrency 1 in QUEUE_POLICY is the only thing stopping the 60s flush
  # and the 120s sweep overlapping, and it works inside one process and nowhere else (docs/04 §3).
  worker:
    build: *api-image
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      API_ROLE: worker
      API_PORT: 3000
      NODE_OPTIONS: --max-old-space-size=${WORKER_HEAP_MB:-384}
    cpu_shares: ${WORKER_CPU_SHARES:-1024}
    mem_limit: ${WORKER_MEM:-1g}
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck: *api-health

  # Reads what Docker already captured, so nothing in the API knows it exists.
  alloy:
    image: grafana/alloy:v1.12.0
    restart: unless-stopped
    logging: *logging
    # The first to yield: shipping a log line is never worth a candidate's request waiting on it.
    cpu_shares: 256
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      LOKI_URL: ${LOKI_URL}
      LOKI_USERNAME: ${LOKI_USERNAME}
      LOKI_PASSWORD: ${LOKI_PASSWORD}
      PROM_URL: ${PROM_URL}
      PROM_USERNAME: ${PROM_USERNAME}
      PROM_PASSWORD: ${PROM_PASSWORD}
      # The same token the API checks on /metrics — one secret, both ends of the scrape.
      METRICS_TOKEN: ${METRICS_TOKEN}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Docker's API is how it finds containers and their compose service names. `:ro` protects the
      # socket FILE and not the API behind it, so this container is root on the box — see the README.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Where it got to in each file, so a restart does not re-ship the last 10 MB.
      - alloy-data:/var/lib/alloy/data
    # Caddy publishes the only ports on this box; Alloy's own UI stays on the compose network.
    expose:
      - '12345'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      API_HOST: ${API_HOST}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates Caddy obtained. Lose this and every restart asks Let's Encrypt again,
      # which rate-limits at five duplicate certificates a week per hostname.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - exam
      - core

volumes:
  caddy-data:
  caddy-config:
  alloy-data:
