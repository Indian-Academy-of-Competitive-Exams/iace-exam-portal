# Local development services for the IACE platform.
#   postgres  — durable data (Prisma)
#   redis     — OTP, sessions, device binding, BullMQ queues, live leaderboards
#   minio     — S3-compatible object storage; prod swaps the endpoint/creds only
#   minio-init— one-shot: creates the bucket, then exits
#
# Nothing here is used in production. The API talks to MinIO through the exact
# same AWS SDK v3 code path it uses for real S3 — only S3_ENDPOINT and the
# credentials differ.

name: iace

services:
  postgres:
    image: postgres:16-alpine
    container_name: iace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iace_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-iace}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-iace} -d ${POSTGRES_DB:-iace}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: iace-redis
    restart: unless-stopped
    # noeviction matches production: live attempt state, leaderboards, OTP and sessions are all
    # here, so a key dropped under memory pressure is a lost sitting, not a cache miss. AOF is what
    # survives a restart mid-test.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: iace-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-iace_minio_user}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-iace_minio_password}
    ports:
      - '${MINIO_PORT:-9000}:9000' # S3 API
      - '${MINIO_CONSOLE_PORT:-9001}:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: wait for MinIO, create the bucket, open it for reading, exit 0. Safe to re-run.
  # Anonymous download because a question's images are embedded as plain S3_PUBLIC_URL links.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: iace-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-iace-local}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-iace_minio_user}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-iace_minio_password}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY_ID\" \"$$S3_SECRET_ACCESS_KEY\" &&
      mc mb --ignore-existing local/\"$$S3_BUCKET\" &&
      mc anonymous set download local/\"$$S3_BUCKET\" &&
      echo \"bucket ready: $$S3_BUCKET\"
      "
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  minio-data:
