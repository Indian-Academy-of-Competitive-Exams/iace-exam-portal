# Local development services for the IACE platform.
#   postgres  — durable data (Prisma)
#   redis     — OTP, sessions, device binding, BullMQ queues, live leaderboards
#   minio     — S3-compatible object storage; prod swaps the endpoint/creds only
#   minio-init— one-shot: creates the bucket, then exits
#
# Nothing here is used in production. The API talks to MinIO through the exact
# same AWS SDK v3 code path it uses for real S3 — only S3_ENDPOINT and the
# credentials differ.

name: iace

services:
  postgres:
    image: postgres:16-alpine
    container_name: iace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iace_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-iace}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-iace} -d ${POSTGRES_DB:-iace}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: iace-redis
    restart: unless-stopped
    # noeviction matches production: live attempt state, leaderboards, OTP and sessions are all
    # here, so a key dropped under memory pressure is a lost sitting, not a cache miss. AOF is what
    # survives a restart mid-test.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: iace-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-iace_minio_user}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-iace_minio_password}
    ports:
      - '${MINIO_PORT:-9000}:9000' # S3 API
      - '${MINIO_CONSOLE_PORT:-9001}:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: wait for MinIO, create the bucket, open it for reading, exit 0. Safe to re-run.
  # Anonymous download because a question's images are embedded as plain S3_PUBLIC_URL links.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: iace-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-iace-local}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-iace_minio_user}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-iace_minio_password}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY_ID\" \"$$S3_SECRET_ACCESS_KEY\" &&
      mc mb --ignore-existing local/\"$$S3_BUCKET\" &&
      mc anonymous set download local/\"$$S3_BUCKET\" &&
      echo \"bucket ready: $$S3_BUCKET\"
      "
    restart: 'no'

  # Not part of the stack: `docker compose up` leaves it alone, and the pre-commit
  # gate starts it on demand. It costs ~2GB, which is five times the rest together.
  #   docker compose --profile sonar up -d sonarqube
  #   docker stop sonarqube
  sonarqube:
    image: sonarqube@sha256:9dfc19385a3b7647e7585013d8c94ae2322228c6b217a1c641199f07f86b12ab
    container_name: sonarqube
    profiles: ['sonar']
    restart: 'no'
    environment:
      # Three JVMs, none of which needs a production heap to scan one repository.
      SONAR_WEB_JAVAOPTS: '-Xmx512m -Xms128m'
      SONAR_CE_JAVAOPTS: '-Xmx512m -Xms128m'
      # Elasticsearch refuses an Xms that differs from its Xmx.
      SONAR_SEARCH_JAVAOPTS: '-Xmx512m -Xms512m'
    # A full scan peaked at 1.76G with the heaps above; the rest is headroom, not budget.
    mem_limit: 2500m
    ports:
      - '${SONAR_PORT:-9004}:9000'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  postgres-data:
  redis-data:
  minio-data:
  # Created before SonarQube was in this file; external so the analysis history,
  # the project and its token survive being adopted by compose.
  sonarqube_data:
    external: true
  sonarqube_extensions:
    external: true
  sonarqube_logs:
    external: true
